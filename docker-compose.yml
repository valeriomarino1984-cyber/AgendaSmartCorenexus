# Ambiente di SVILUPPO locale. Non usare in produzione.
# Uso: cp .env.example .env  (impostare le password)  →  docker compose up --build
# Il frontend si avvia a parte: cd frontend && pnpm dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: corenexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?impostare in .env}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?impostare in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?impostare in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      # estensione .inc: l'entrypoint non lo esegue da solo, lo richiama 01-roles.sh
      - ./infra/db/roles.sql:/docker-entrypoint-initdb.d/roles.sql.inc:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corenexus"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ./backend, dockerfile: ../infra/docker/backend.Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://corenexus_migrator:${MIGRATOR_DB_PASSWORD}@postgres:5432/corenexus
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ./backend, dockerfile: ../infra/docker/backend.Dockerfile }
    environment:
      ENVIRONMENT: development
      LOG_JSON: "false"
      DATABASE_URL: postgresql+asyncpg://corenexus_app:${APP_DB_PASSWORD}@postgres:5432/corenexus
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: http://localhost:3000
      PUBLIC_BOOKING_BASE_URL: http://localhost:3000/prenota
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
