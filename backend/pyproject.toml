[project]
name = "corenexus-agenda-backend"
version = "0.1.0"
description = "CoreNexus Agenda – API backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1",          # driver MySQL/MariaDB in puro Python: nessuna compilazione su cPanel
    "alembic>=1.14",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.19",
    "a2wsgi>=1.10",          # FastAPI (ASGI) dentro Passenger (WSGI) di cPanel
]

[dependency-groups]
dev = [
    "uvicorn>=0.32",         # solo sviluppo locale
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]  # nomi tabella generati nei test
"migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
